<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
<meta name="theme-color" content="#fff2dc" />
<title>大狗Tap</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🐶</text></svg>" />
<link rel="preload" href="audio-data.json?v=20260810-wav" as="fetch" crossorigin="anonymous" />
<link rel="preload" href="main.js?v=20260810-wav2" as="script" />
<style>
  /* 全页面限定调色板：米白底 + 主色黄 + 次色灰（极少点缀色） */
  :root {
    --cream: #fff2dc;   /* 背景 · 米白 */
    --amber: #ffb400;   /* 主色 · 黄 */
    --gray:  #87837e;   /* 次要 · 灰 */
    --coral: #ff5a5f;   /* 点缀（少量） */
    --teal:  #16c2a3;   /* 点缀（少量） */
    --blue:  #3e7bfa;   /* 点缀（少量） */
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; overflow: hidden; }
  body {
    font-family: "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
    background: var(--cream);
    color: var(--gray);
    -webkit-tap-highlight-color: transparent;
    user-select: none;
    -webkit-user-select: none;
    touch-action: none;
  }

  /* 纯色背景（固定米白，canvas 未启动时的兜底色） */
  #stage {
    position: fixed;
    inset: 0;
    overflow: hidden;
    isolation: isolate;
    background: var(--cream);
    --scene-unit: 200px;
  }

  /* 全屏特效画布（仿 Mikutap：特效铺满全屏、层层叠加） */
  #fx {
    position: absolute;
    inset: 0;
    z-index: 3;
    pointer-events: none;
  }

  /* 分区按钮闪光层：点击/滑过时分区短暂显示半透明白色再淡出 */
  #zoneflash {
    position: absolute;
    inset: 0;
    z-index: 5;
    pointer-events: none;
  }
  /* 可选的按键网格：默认透明，开启后只显示边界，不改变原有白色触发闪光。 */
  #key-grid {
    position: absolute;
    inset: 0;
    z-index: 4;
    display: grid;
    grid-template-columns: repeat(var(--key-grid-cols, 4), minmax(0, 1fr));
    grid-template-rows: repeat(var(--key-grid-rows, 3), minmax(0, 1fr));
    opacity: 0;
    pointer-events: none;
    transition: opacity .2s ease;
  }
  #key-grid.is-visible { opacity: 1; }
  .key-grid-cell {
    box-shadow: inset 0 0 0 .5px rgba(135, 131, 126, .14);
    background: rgba(255, 255, 255, .025);
  }

  .zone-flash {
    position: absolute;
    background: #fff;
    border-radius: 0;
    opacity: 0;
    animation: zoneFade .45s ease-out forwards;
  }
  @keyframes zoneFade {
    0%   { opacity: .45; }
    100% { opacity: 0; }
  }

  /* 大狗 */
  #dog {
    position: absolute;
    inset: 0;
    z-index: 6;
    display: flex;
    align-items: center;
    justify-content: center;
    pointer-events: none;
    will-change: transform;
    transform-origin: 50% 62%;   /* 节拍压缩围绕狗身体中下部进行 */
  }
  #dog-inner {
    position: relative;
    width: var(--scene-unit);
    will-change: transform;   /* 叫弹簧跳由 JS 逐帧驱动（无 CSS transition，保证果断跟手） */
  }
  /* 长按果冻层：transform / 变红滤镜全部由 JS 逐帧驱动（Q弹 + 高频抖动） */
  #dog-jelly {
    position: relative;
    will-change: transform, filter;
  }
  #dog-inner img {
    width: 100%;
    display: block;
    filter: drop-shadow(0 18px 40px rgba(135, 131, 126, .4));
  }
  /* 张嘴图叠在闭嘴图之上：下层始终不透明，只切换上层透明度，
     避免交叉淡化时两张图都半透明导致整体变透明 */
  #dog-open {
    position: absolute;
    left: 0; top: 0;
    opacity: 0;
    transition: opacity .08s linear;
  }
  #dog-inner.bark-image #dog-open { opacity: 1; }

  /* 哈基米的两张图轮廓不同，单独改为互斥可见，避免透明区域露出闭嘴图。 */
  #dog-inner.is-hajimi #dog-open {
    visibility: hidden;
    transition: none;
  }
  #dog-inner.is-hajimi.bark-image #dog-close { visibility: hidden; }
  #dog-inner.is-hajimi.bark-image #dog-open { visibility: visible; }

  /* 东海帝皇由 Web Audio 时钟驱动透明画布；图集为无损高分辨率帧，
     画布只负责显示当前节拍对应帧，并使用独立柔和阴影避免缩放后的硬边。 */
  #dog-inner #dog-animation {
    position: absolute;
    left: 50%;
    top: 50%;
    width: 70%;
    height: auto;
    display: block;
    opacity: 0;
    visibility: hidden;
    filter: drop-shadow(0 10px 20px rgba(105, 99, 93, .28));
    transform: translate(-50%, -50%);
    transition: none;
  }
  #dog-inner.is-emperor-animation #dog-close,
  #dog-inner.is-emperor-animation #dog-open {
    visibility: hidden;
  }
  #dog-inner.is-emperor-animation #dog-animation {
    opacity: 1;
    visibility: visible;
  }

  /* 顶部控制：互动时隐藏，闲置 2 秒后由 JS 淡入 */
  #top-controls {
    position: absolute;
    top: max(14px, env(safe-area-inset-top));
    left: max(14px, env(safe-area-inset-left));
    right: max(14px, env(safe-area-inset-right));
    z-index: 20;
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    opacity: 0;
    transform: translateY(-8px);
    pointer-events: none;
    /* 投影放在容器上：按钮本体用了 clip-path 切角，box-shadow 会被一起裁掉，
       容器的 drop-shadow 才能贴合八边形轮廓 */
    filter: drop-shadow(0 6px 14px rgba(135, 131, 126, .22));
    transition: opacity .5s ease, transform .5s cubic-bezier(.2, .8, .2, 1);
  }
  #top-controls.is-visible {
    opacity: 1;
    transform: translateY(0);
  }
  #top-controls.is-revealing-fast {
    transition-duration: .2s;
  }
  /* 有未读红点时只固定设置入口；音乐/音效按钮仍按原规则隐藏。 */
  #audio-controls {
    opacity: 1;
    transform: translateY(0);
    transition: opacity .5s ease, transform .5s cubic-bezier(.2, .8, .2, 1);
  }
  .control-group {
    display: flex;
    gap: 8px;
  }
  /* 几何化切角按钮：八边形轮廓呼应全屏几何特效（hexagon / diamond 粒子）。
     按钮本体背景充当“描边色”，::before 用缩小一号的同款切角多边形铺底色，
     描边因此能严格贴合切角（普通 border 做不到），颜色用变量一键切换 */
  .control-button {
    --btn-edge: rgba(135, 131, 126, .72);   /* 描边色 */
    --btn-fill: rgba(255, 242, 220, .92);   /* 底色 */
    position: relative;
    min-width: 68px;
    min-height: 44px;
    padding: 8px 12px;
    border: none;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    color: var(--gray);
    background: var(--btn-edge);
    clip-path: polygon(10px 0, calc(100% - 10px) 0, 100% 10px, 100% calc(100% - 10px),
                       calc(100% - 10px) 100%, 10px 100%, 0 calc(100% - 10px), 0 10px);
    font: 700 13px/1 "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
    cursor: pointer;
    pointer-events: auto;
    touch-action: manipulation;
    -webkit-tap-highlight-color: transparent;
    transform: scale(var(--rhythm-scale, 1));
    transition: color .2s ease, background .2s ease;
  }
  .control-button::before {
    content: "";
    position: absolute;
    inset: 2px;
    z-index: -1;
    background: var(--btn-fill);
    clip-path: polygon(8px 0, calc(100% - 8px) 0, 100% 8px, 100% calc(100% - 8px),
                       calc(100% - 8px) 100%, 8px 100%, 0 calc(100% - 8px), 0 8px);
    transition: background .2s ease;
  }
  /* 律动缩放由 JS 使用 Web Audio 时钟逐帧写入，避免切换静音时相位重置 */
  .control-button:active { transform: scale(.94); }
  .control-button:focus-visible {
    outline: 3px solid rgba(62, 123, 250, .38);
    outline-offset: 2px;
  }
  /* 悬停描边变琥珀色（仅桌面端）；.is-muted 规则在更后面，静音态优先 */
  @media (hover: hover) {
    .control-button:hover { --btn-edge: rgba(255, 180, 0, .85); }
  }
  .control-button svg {
    width: 20px;
    height: 20px;
    overflow: visible;
    fill: none;
    stroke: currentColor;
    stroke-width: 2;
    stroke-linecap: round;
    stroke-linejoin: round;
  }
  /* 顶部音效按钮里的角色小图（替代 svg 图标）：与 svg 同尺寸、同投影手感。 */
  .control-button img {
    width: 22px;
    height: 22px;
    object-fit: contain;
    filter: drop-shadow(0 2px 3px rgba(135, 131, 126, .35));
  }
  .control-button .mute-slash {
    opacity: 0;
    stroke: var(--coral);
    stroke-width: 2.6;
    transition: opacity .2s ease;
  }
  .control-button.is-muted {
    --btn-edge: rgba(255, 90, 95, .68);
    --btn-fill: rgba(255, 255, 255, .94);
    color: var(--coral);
  }
  .control-button.is-muted .mute-slash { opacity: 1; }
  /* 演奏开关按钮（钢琴 / 八度）开启态：琥珀描边 + 淡黄底，表示已激活。 */
  .control-button.is-active {
    --btn-edge: rgba(255, 180, 0, .9);
    --btn-fill: rgba(255, 244, 224, .94);
    color: #b57e00;
  }
  /* 顶部「+」添加自定义形象按钮：比常规按钮窄，单独成按钮。 */
  .character-add-button { min-width: 44px; padding: 8px 10px; }
  /* 自定义形象编辑弹层（与 #toy-notice 同风格：写死 HTML + CSS + main.js 逻辑）。 */
  #custom-character-modal {
    position: fixed; inset: 0; z-index: 60;
    display: flex; align-items: center; justify-content: center;
    padding: 16px;
    background: rgba(20, 16, 12, .55);
    opacity: 0; visibility: hidden;
    transition: opacity .25s ease, visibility .25s;
  }
  #custom-character-modal.is-open { opacity: 1; visibility: visible; }
  .ccm-panel {
    width: min(420px, 100%);
    max-height: calc(100dvh - 32px);
    overflow-y: auto;
    padding: 18px 18px 16px;
    border: 2px solid rgba(135, 131, 126, .6);
    border-radius: 14px;
    background: rgba(255, 246, 232, .98);
    box-shadow: 0 24px 60px rgba(0, 0, 0, .35);
    color: var(--gray);
    font: 600 14px/1.5 "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
  }
  .ccm-title { margin-bottom: 8px; font-size: 18px; font-weight: 800; }
  .ccm-desc { margin: 0 0 14px; font-size: 12.5px; line-height: 1.55; color: #6b665e; }
  .ccm-slots { display: flex; gap: 10px; margin-bottom: 12px; }
  .ccm-slot {
    position: relative; flex: 1; aspect-ratio: 3 / 4;
    display: flex; align-items: center; justify-content: center;
    padding: 0; overflow: hidden; cursor: pointer;
    border: 2px dashed rgba(135, 131, 126, .5);
    border-radius: 10px; background: rgba(255, 255, 255, .6);
  }
  .ccm-slot.is-filled { border-style: solid; border-color: rgba(255, 180, 0, .85); }
  .ccm-slot-tag {
    position: absolute; top: 6px; left: 6px;
    padding: 1px 6px; border-radius: 6px;
    font-size: 11px; font-weight: 700; color: #fff;
    background: rgba(135, 131, 126, .75);
  }
  .ccm-slot-ph { font-size: 12px; color: #9a948c; text-align: center; }
  .ccm-slot.is-filled .ccm-slot-ph { display: none; }
  .ccm-slot-img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; }
  /* 隐藏的 file input：用 sr-only 样式而非 display:none，确保 <label for> 能稳定触发文件选择框。 */
  .ccm-file-input {
    position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px;
    overflow: hidden; clip: rect(0, 0, 0, 0); white-space: nowrap; border: 0; opacity: 0;
  }
  .ccm-preview {
    position: relative; display: block; width: 100%; max-height: 220px;
    aspect-ratio: 3 / 4; margin: 0 auto 12px; padding: 0; overflow: hidden; cursor: pointer;
    border: 2px solid rgba(135, 131, 126, .4); border-radius: 10px; background: rgba(255, 255, 255, .5);
  }
  .ccm-preview-img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; }
  .ccm-preview-open { opacity: 0; transition: opacity .08s linear; }
  .ccm-preview.is-open .ccm-preview-open { opacity: 1; }
  .ccm-preview-hint {
    position: absolute; bottom: 6px; left: 50%; transform: translateX(-50%);
    padding: 2px 8px; border-radius: 6px; pointer-events: none; white-space: nowrap;
    font-size: 11px; color: #fff; background: rgba(135, 131, 126, .75);
  }
  .ccm-preview:not(.has-img) .ccm-preview-hint { display: none; }
  .ccm-name-row { display: flex; align-items: center; gap: 8px; margin-bottom: 12px; }
  .ccm-name-row label { font-size: 13px; font-weight: 700; }
  #ccm-name {
    flex: 1; padding: 7px 10px; font-size: 14px; color: var(--gray);
    border: 1px solid rgba(135, 131, 126, .45); border-radius: 8px; background: #fff;
  }
  .ccm-existing { margin-bottom: 12px; font-size: 12px; }
  .ccm-existing-title { margin-bottom: 6px; font-weight: 700; color: #6b665e; }
  .ccm-existing-list { display: flex; flex-wrap: wrap; gap: 8px; }
  .ccm-existing-item {
    display: flex; align-items: center; gap: 4px; padding: 3px 6px 3px 3px; cursor: pointer;
    border: 1px solid rgba(135, 131, 126, .35); border-radius: 8px; background: #fff;
  }
  .ccm-existing-item img { width: 30px; height: 30px; object-fit: contain; }
  .ccm-existing-item span { font-size: 12px; color: #b5433a; }
  .ccm-actions { display: flex; gap: 8px; justify-content: flex-end; }
  #ccm-confirm.is-ready { --btn-edge: rgba(255, 180, 0, .9); --btn-fill: rgba(255, 244, 224, .96); color: #b57e00; }


  /* Toy SDK 状态提示：不打断演奏，也不会把点击穿透到舞台。 */
  #toy-notice {
    position: absolute;
    left: 50%;
    bottom: max(24px, calc(env(safe-area-inset-bottom) + 16px));
    z-index: 60;
    width: min(420px, calc(100% - 32px));
    padding: 12px 16px;
    color: #6f6a63;
    background: rgba(255, 250, 240, .97);
    border: 2px solid rgba(255, 180, 0, .72);
    border-radius: 12px;
    box-shadow: 0 10px 28px rgba(135, 131, 126, .24);
    font-size: 13px;
    font-weight: 650;
    line-height: 1.55;
    text-align: center;
    opacity: 0;
    pointer-events: none;
    transform: translate(-50%, 12px) scale(.98);
    transition: opacity .2s ease, transform .2s ease;
  }
  #toy-notice.is-visible {
    opacity: 1;
    transform: translate(-50%, 0) scale(1);
  }
  #toy-notice.is-error {
    color: #9e4145;
    border-color: rgba(255, 90, 95, .72);
  }
  @media (max-width: 430px) {
    #top-controls {
      top: max(10px, env(safe-area-inset-top));
      left: max(10px, env(safe-area-inset-left));
      right: max(10px, env(safe-area-inset-right));
    }
    .control-button {
      min-width: 44px;
      padding-inline: 10px;
    }
    .control-button span { display: none; }
    /* 音效选择按钮保留音效名（关键状态），不随其他按钮收成纯图标。 */
    .control-button.sfx-set-button span,
    .control-button.character-set-button span { display: inline; }
  }

  /* 开始遮罩（首次点击解锁音频） */
  #overlay {
    position: absolute;
    inset: 0;
    z-index: 10;
    display: flex;
    flex-direction: column;
    gap: 2.2vmin;
    align-items: center;
    justify-content: center;
    background: rgba(255, 242, 220, .9);
    transition: opacity .5s ease;
    cursor: pointer;
  }
  #overlay.hide { opacity: 0; pointer-events: none; }
  #overlay .title {
    font-size: clamp(34px, 8vmin, 72px);
    font-weight: 900;
    letter-spacing: .18em;
    color: var(--amber);
  }
  #overlay .title em { font-style: normal; color: var(--gray); }
  #overlay .sub {
    font-size: clamp(13px, 2.4vmin, 18px);
    letter-spacing: .5em;
    color: var(--gray);
    animation: pulse 1.6s ease-in-out infinite;
  }
  @keyframes pulse { 50% { opacity: .35; } }

  /* 版本号：右下角低调显示，不挡全屏互动 */
  .version-tag {
    position: fixed;
    right: 10px;
    bottom: 8px;
    z-index: 70;
    font-size: 11px;
    line-height: 1;
    color: var(--gray);
    opacity: .45;
    letter-spacing: .5px;
    pointer-events: none;
    user-select: none;
    -webkit-user-select: none;
  }
</style>
</head>
<body>
  <div class="version-tag" aria-hidden="true">v1.0.260810-test5</div>
  <div id="stage">
    <canvas id="fx"></canvas>
    <div id="key-grid" aria-hidden="true"></div>
    <div id="zoneflash"></div>

    <div id="dog">
      <div id="dog-inner" class="is-hajimi">
        <div id="dog-jelly">
          <img id="dog-close" src="Image/maodie_close_mouth.webp" alt="哈基米" draggable="false" />
          <img id="dog-open" src="Image/maodie_open_mouth.webp" alt="" draggable="false" />
          <canvas id="dog-animation" width="360" height="514" role="img" aria-label="东海帝皇循环动画" aria-hidden="true"></canvas>
        </div>
      </div>
    </div>
    <img id="dog-animation-atlas" alt="" hidden decoding="async" fetchpriority="low" />

    <div id="top-controls" class="is-visible" aria-label="声音控制">
      <div id="audio-controls" class="control-group">
        <button id="music-toggle" class="control-button" type="button" aria-label="关闭音乐" aria-pressed="false">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M9 18V5l10-2v13" />
            <circle cx="6" cy="18" r="3" />
            <circle cx="16" cy="16" r="3" />
            <path class="mute-slash" d="M4 3l16 18" />
          </svg>
          <span>音乐</span>
        </button>
        <button id="sfx-set-toggle" class="control-button sfx-set-button" type="button" aria-label="切换音效，当前 ha-ji-mi">
          <svg id="sfx-set-mute-icon" class="sfx-set-mute-icon" viewBox="0 0 24 24" aria-hidden="true" style="display:none">
            <path d="M5 9v6h4l5 4V5L9 9H5z" />
            <path d="M17 9.5a4 4 0 010 5" />
            <path d="M4 3l16 18" />
          </svg>
          <span id="sfx-set-label">ha-ji-mi</span>
        </button>
        <button id="character-set-toggle" class="control-button character-set-button" type="button" aria-label="切换形象，当前哈基米">
          <img id="character-set-icon" class="character-set-icon" src="Image/maodie_close_mouth.webp" alt="" draggable="false" />
        </button>
        <button id="character-add-toggle" class="control-button character-add-button" type="button" aria-label="添加自定义形象">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M12 5v14M5 12h14" />
          </svg>
        </button>
        <button id="piano-mode-toggle" class="control-button perf-toggle" type="button" role="switch" aria-checked="false" data-setting="pianoMode" aria-label="钢琴模式" disabled>
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <rect x="4" y="5" width="16" height="14" rx="1" />
            <path d="M9 5v8M15 5v8" />
          </svg>
          <span>钢琴</span>
        </button>
        <button id="octave-toggle" class="control-button" type="button" aria-label="切换八度，当前 C4" disabled>
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M12 4v16" />
            <path d="M7 9l5-5 5 5" />
            <path d="M7 15l5 5 5-5" />
          </svg>
          <span id="octave-toggle-label">C4</span>
        </button>
      </div>
    </div>

    <div id="toy-notice" role="status" aria-live="assertive" aria-atomic="true" aria-hidden="true"></div>

    <div id="custom-character-modal" aria-hidden="true">
      <div class="ccm-panel" role="dialog" aria-modal="true" aria-labelledby="ccm-title">
        <div id="ccm-title" class="ccm-title">添加自定义形象</div>
        <p class="ccm-desc">依次上传「闭嘴」和「张嘴」两张图。要求：两张图<strong>尺寸完全相同</strong>、画面<strong>严格对齐</strong>（建议用同一张图只改嘴巴部位），背景保持不透明或一致。下方可点击预览张嘴效果。</p>
        <div class="ccm-slots">
          <label class="ccm-slot" id="ccm-slot-close" for="ccm-file-close">
            <span class="ccm-slot-tag">闭嘴</span>
            <span class="ccm-slot-ph">点此选择图片</span>
            <img class="ccm-slot-img" alt="" draggable="false" />
          </label>
          <label class="ccm-slot" id="ccm-slot-open" for="ccm-file-open">
            <span class="ccm-slot-tag">张嘴</span>
            <span class="ccm-slot-ph">点此选择图片</span>
            <img class="ccm-slot-img" alt="" draggable="false" />
          </label>
        </div>
        <button type="button" id="ccm-preview" class="ccm-preview" aria-label="点击预览张嘴效果">
          <span class="ccm-preview-hint">点击预览张嘴效果</span>
          <img class="ccm-preview-img ccm-preview-close" alt="" draggable="false" />
          <img class="ccm-preview-img ccm-preview-open" alt="" draggable="false" />
        </button>
        <div class="ccm-name-row">
          <label for="ccm-name">名称</label>
          <input id="ccm-name" type="text" maxlength="6" placeholder="我的形象" />
        </div>
        <div class="ccm-existing" id="ccm-existing" style="display:none">
          <div class="ccm-existing-title">已添加的自定义形象（点 × 删除）</div>
          <div class="ccm-existing-list" id="ccm-existing-list"></div>
        </div>
        <div class="ccm-actions">
          <button type="button" id="ccm-cancel" class="control-button">取消</button>
          <button type="button" id="ccm-confirm" class="control-button" disabled>保存并使用</button>
        </div>
        <input type="file" id="ccm-file-close" class="ccm-file-input" accept="image/png,image/jpeg,image/webp" />
        <input type="file" id="ccm-file-open" class="ccm-file-input" accept="image/png,image/jpeg,image/webp" />
      </div>
    </div>

    <div id="overlay">
      <div class="title">大狗<em>Tap</em></div>
      <div class="sub">点 击 任 意 位 置 开 始</div>
    </div>
  </div>

  <script src="main.js?v=20260810-wav2"></script>
</body>
</html>
